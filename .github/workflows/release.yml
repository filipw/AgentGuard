name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build
      run: dotnet build AgentGuard.slnx --configuration Release

    - name: Test
      # -m:1 runs the test projects one at a time, as the CI workflow does: several suites check that
      # large inputs are scanned within the rules' regex match timeouts, which are wall-clock, and the
      # CPU-heavy ONNX suite running alongside would eat into them
      run: dotnet test AgentGuard.slnx --configuration Release --no-build -m:1

    - name: Pack
      run: |
        dotnet pack AgentGuard.slnx \
          --configuration Release \
          --no-build \
          --output artifacts/packages \
          -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: |
        dotnet nuget push "artifacts/packages/*.nupkg" \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Push symbols to NuGet
      run: |
        dotnet nuget push "artifacts/packages/*.snupkg" \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Attach packages to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
